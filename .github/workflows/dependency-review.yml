name: Repository Security

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: repository-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-security-metadata:
    name: Repository security metadata gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate repository security baseline metadata
        run: pwsh scripts/validate-repository-security-baseline.ps1

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Dependency review
        uses: actions/dependency-review-action@v4.9.0
        with:
          fail-on-severity: high
          vulnerability-check: true
          license-check: false
          comment-summary-in-pr: always
