name: Verify

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend security and quality gate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/api-dotnet

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore Caritas.Brigadas.sln

      - name: Build with warnings as errors
        run: dotnet build Caritas.Brigadas.sln --configuration Release --no-restore /p:TreatWarningsAsErrors=true

      - name: Test with warnings as errors
        run: dotnet test Caritas.Brigadas.sln --configuration Release --no-build --verbosity normal /p:TreatWarningsAsErrors=true

      - name: Audit NuGet vulnerable packages
        run: dotnet list Caritas.Brigadas.sln package --vulnerable --include-transitive

  frontend:
    name: Frontend security and quality gate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web-next

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/web-next/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=moderate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  deployment-metadata:
    name: Deployment baseline metadata gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate deployment baseline metadata
        run: pwsh scripts/validate-deployment-baseline.ps1

  docker:
    name: Docker image build gate
    runs-on: ubuntu-latest
    needs:
      - deployment-metadata

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build API Docker image
        run: docker build -f services/api-dotnet/src/Caritas.Brigadas.Api/Dockerfile -t caritas-brigadas-api:ci services/api-dotnet