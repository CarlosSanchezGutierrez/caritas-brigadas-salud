name: Verify

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  backend:
    name: Backend ASP.NET Core
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/api-dotnet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore Caritas.Brigadas.sln

      - name: Build
        run: dotnet build Caritas.Brigadas.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Caritas.Brigadas.sln --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend Next.js
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web-next

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/web-next/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=moderate